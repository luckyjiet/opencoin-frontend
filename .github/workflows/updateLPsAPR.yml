name: Fetch and update LP APRs

on:
  workflow_dispatch:

jobs:
  updateLPsAPRs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Fetch and save LP APR data
        run: npm run updateLPsAPR

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v3
        with:
          delete-branch: true
          commit-message: 'chore: Update LP APRs for Farms'
          title: Update LP APRs for Farms
          body: |
            - Update LP APRs for Farms

            Auto-generated by [create-pull-request][1]

            [1]: https://github.com/peter-evans/create-pull-request
          branch: update-lp-aprs-for-farms
