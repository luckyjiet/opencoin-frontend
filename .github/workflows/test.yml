name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    name: Unit tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false
